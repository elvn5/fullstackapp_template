# Пример reverse proxy для STAGING (test.*). Замените example.com на свой домен.
# Ставится на сервер: /etc/nginx/conf.d/app-staging.conf
# Порты соответствуют staging compose-проекту (app-staging):
#   client 4002, admin 4000, api (gateway) 4001 — все на 127.0.0.1.
# Для production — тот же файл с доменами без test. и портами 3002/3000/3001.
# После правки: nginx -t && systemctl reload nginx
# TLS-строки (443/redirect) допишет certbot --nginx для этих доменов.

# --- CLIENT: test.example.com -> 127.0.0.1:4002 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.example.com;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- ADMIN: test.admin.example.com -> 127.0.0.1:4000 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- API (gateway): test.api.example.com -> 127.0.0.1:4001 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.api.example.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
