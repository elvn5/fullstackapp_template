# Локальная разработка с hot-reload:
#   docker compose -f docker-compose.dev.yml up --build
#
# Go-сервисы перезапускаются через air (services/.air.toml), Nuxt — через свой dev-сервер.
# Исходники монтируются в контейнеры. node_modules и кэши Go живут в именованных
# томах и не смешиваются с файлами на хосте. Нужен файл .env в корне
# (скопируй из .env.example и заполни BOT_TOKEN, JWT_SECRET, ADMIN_PASSWORD).
name: app-dev

x-go: &go
  build:
    context: ./services
    dockerfile: Dockerfile.dev
  env_file: .env
  working_dir: /services
  volumes:
    - ./services:/services
    - go_mod_cache:/go/pkg/mod
    - go_build_cache:/root/.cache/go-build

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env
  working_dir: /repo
  environment: &node-env
    CHOKIDAR_USEPOLLING: "true" # надёжный watch файлов на macOS Docker
  volumes:
    - .:/repo
    - pnpm_store:/pnpm-store
    - root_nm:/repo/node_modules
    - admin_nm:/repo/apps/admin/node_modules
    - client_nm:/repo/apps/client/node_modules
    - theme_nm:/repo/packages/theme/node_modules
    - admin_nuxt:/repo/apps/admin/.nuxt
    - client_nuxt:/repo/apps/client/.nuxt

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-users}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    <<: *go
    environment:
      SERVICE: gateway
      HTTP_PORT: "3001"
      AUTH_SERVICE_URL: http://auth:8081
      USERS_SERVICE_URL: http://users:8082
    ports:
      - "${API_PORT:-3001}:3001"

  auth:
    <<: *go
    environment:
      SERVICE: auth
      HTTP_PORT: "8081"

  users:
    <<: *go
    environment:
      SERVICE: users
      HTTP_PORT: "8082"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *go
    environment:
      SERVICE: bot
      USERS_SERVICE_URL: http://users:8082

  # Разовая установка npm-зависимостей для фронтендов.
  deps:
    <<: *node
    command: sh -c "pnpm install --frozen-lockfile=false"
    restart: "no"

  admin:
    <<: *node
    command: sh -c "pnpm --filter @app/admin dev -- --host 0.0.0.0 --port 3000"
    environment:
      <<: *node-env
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      deps:
        condition: service_completed_successfully

  client:
    <<: *node
    command: sh -c "pnpm --filter @app/client dev -- --host 0.0.0.0"
    environment:
      <<: *node-env
      NUXT_API_INTERNAL_URL: "http://gateway:3001"
    ports:
      - "${CLIENT_PORT:-3002}:3002"
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  postgres_data_dev:
  go_mod_cache:
  go_build_cache:
  pnpm_store:
  root_nm:
  admin_nm:
  client_nm:
  theme_nm:
  admin_nuxt:
  client_nuxt:
